# Meme sniper configuration.
# This bot is paper-only. If this file says anything else, the program still stays in paper mode.
# It does not use a private key and it cannot send a real transaction.

mode: "paper"

# Optional Render environment variables (Dashboard → your service → Environment):
#   HELIUS_API_KEY        Better wallet tracking. Leave unset to use the free public Solana RPC.
#   SOLANA_RPC_URL        Your own Solana RPC URL, if you have one. This overrides the public RPC.
#   MEME_SNIPER_ENABLED   Set to false to turn this bot off without editing code.

capital:
  # These dollar amounts are the shape for a $100 slice.
  # The main app scales them to the portfolio share in config/global.yaml.
  # Running this file by itself still uses the $100 paper account below.
  initial: 100
  max_position_usd: 2            # 2% of the sniper bankroll per trade
  max_open_positions: 2
  daily_loss_limit_usd: 5        # 5% of the bankroll, then no new trades that day

risk:
  take_profit_1: 1.0             # 2x, sell one third, then stop moves to breakeven
  take_profit_2: 0               # no fixed 4x sale
  take_profit_3: 0               # no fixed 8x sale
  take_profit_size: 0.333333
  trail_pct: 0.20                # after 2x, trail 20% below the highest price
  stop_loss: 0.20                # -20%
  time_stop_minutes: 1440        # 24 hours

sources:
  discovery: true                # New tokens from DexScreener, and pump.fun when it answers
  wallet_copy: true              # Buys by the enabled tracked wallets
  poll_interval_seconds: 45
  max_token_age_minutes: 180     # Ignore discovery tokens older than this
  max_tokens_per_poll: 3
  min_wallet_buy_usd: 25         # Ignore wallet buys smaller than this
  max_signatures_per_poll: 25
  max_transactions_per_poll: 8

filters:
  max_dev_buy_pct: 5.0
  max_bundle_pct: 12.0
  max_top_holder_pct: 45.0       # Used when holder data could be read
  max_top10_holders_pct: 30.0    # skip when the top 10 own more than this
  min_liquidity_usd: 50000       # post-migration coins only; $800 was too low
  max_sniper_wallets: 15
  max_price_impact_pct: 25.0     # Reject a token whose small sell moves the price more than this
  require_safety_check: true     # Never buy when mint/freeze data was not read
  require_sell_route: true       # Jupiter must show a sell back to SOL
  # The free public RPC often refuses the holder lookup. High concentration is still
  # rejected whenever the lookup works. Set this to true after you add HELIUS_API_KEY
  # or SOLANA_RPC_URL if you want to skip every token whose holders could not be read.
  require_graduated: true        # PumpSwap or Raydium only, not the bonding curve
  min_graduated_age_seconds: 1800
  require_lp_lock: true          # LP must be shown locked or burned, or the buy is skipped
  require_dev_check: true        # dev wallet must be measured and under 5%
  require_two_sided_volume: true
  min_unique_buyers: 2
  max_sell_tax_pct: 5.0
  require_holder_data: true      # skip the buy when holder data cannot be read

execution:
  # Paper fills use the price we actually see (already up to one poll late)
  # and then add the fee and slippage below. This is not a live order.
  fee_rate: 0.001
  slippage_rate: 0.01
  delay_seconds: 45
  chain: "solana"
