# Global configuration for the multi-bot trading system

exchange:
  id: binance
  sandbox: true          # Use testnet when true
  options:
    defaultType: future  # spot | future | swap

trading:
  mode: paper            # paper | live
  base_currency: USDT
  initial_equity: 10000.0

risk:
  max_drawdown_pct: 15.0
  daily_loss_limit_pct: 5.0
  max_total_exposure_pct: 80.0
  max_open_positions: 12

capital_allocation:
  # Weights for the share left after the meme sniper.
  # The old trend, mean-reversion and breakout bots stay in the repo but at 0.
  # Of the money left after the meme sniper: two thirds trend, one third swing.
  # On a $10,000 account that is $6,000 and $3,000. The sniper's 10% is separate.
  ensemble_trend: 2.0
  swing: 1.0
  trend_bot: 0
  mean_reversion_bot: 0
  breakout_bot: 0

logging:
  level: INFO
  json_format: true
  log_dir: logs
  max_bytes: 10485760    # 10 MB
  backup_count: 5

metrics:
  enabled: true
  port: 8000
  path: /metrics

telegram:
  enabled: true
  rate_limit_per_minute: 20
  notify_on:
    - trade_entry
    - trade_exit
    - stop_loss
    - take_profit
    - error
    - daily_summary

persistence:
  db_path: data/trading.db
  equity_snapshot_interval_sec: 60

bots:
  - name: ensemble_trend
    # Paper forward test. The saved backtest did not pass every rule.
    enabled: true
    config_file: config/ensemble_trend.yaml
  - name: swing
    # Paper forward test. The saved swing backtest did not pass every rule.
    enabled: true
    config_file: config/swing.yaml
  - name: trend_bot
    enabled: false
    config_file: config/trend_bot.yaml
  - name: mean_reversion_bot
    enabled: false
    config_file: config/mean_reversion_bot.yaml
  - name: breakout_bot
    enabled: false
    config_file: config/breakout_bot.yaml

# Paper-only Solana meme sniper.
# portfolio_share is this bot's slice of the whole paper account.
# 0.10 means 10%. The smallest allowed share is 0.10 and the largest is 0.30.
# Set MEME_SNIPER_ENABLED=false to turn the sniper off.
meme_sniper:
  enabled: true
  config_file: meme_sniper/config.yaml
  portfolio_share: 0.10
