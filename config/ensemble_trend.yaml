name: ensemble_trend
strategy: donchian_ensemble
enabled: true

# Daily Binance spot candles. Same public source as the backtest. Paper only.
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - HYPE/USDT

timeframe: 1d

parameters:
  # Conservative forward test. The published research test used 25%.
  target_vol: 0.15
  vol_lookback: 90
  rebalance_band: 0.20
  fee_rate: 0.001
  slippage_rate: 0.001
  per_coin_cap: 0.25
  gross_cap: 0.60
  # On for this paper test. The long window passed; the holdout year did not.
  regime_filter: true
  funding_filter: false

risk:
  max_positions: 4
