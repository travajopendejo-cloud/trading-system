name: ensemble_trend
strategy: donchian_ensemble
enabled: true

# Daily Binance spot candles. Same public source as the backtest. Paper only.
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - HYPE/USDT

timeframe: 1d

parameters:
  # Moderate paper book. Shorts are half a long, which kept the 2020-2025 drop at 24.1%.
  target_vol: 0.25
  vol_lookback: 90
  rebalance_band: 0.20
  fee_rate: 0.001
  slippage_rate: 0.001
  per_coin_cap: 0.35
  gross_cap: 1.50
  max_model_weight: 1.50
  # Longs while Bitcoin is above its 200-day average.
  # Shorts while Bitcoin is below it, at half the long size.
  regime_filter: true
  shorts: true
  short_scale: 0.5
  funding_filter: false

risk:
  max_positions: 4
